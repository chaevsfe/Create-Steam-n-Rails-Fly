name: Build

on: [workflow_dispatch, push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Loom Cache
        uses: actions/cache@v4
        with:
          path: "**/.gradle/loom-cache"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.*', '**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-disabled: false
          cache-read-only: false

      - name: Fetch the Create Fly Recipe Viewer jar nested into the build
        env:
          VIEWER_JAR_NAME: CreateReiViewer-1.0.0-fly.26.2-beta.5+fabric-mc26.2.jar
          VIEWER_JAR_URL: https://github.com/chaevsfe/CreateReiViewer-Fly/releases/download/1.0.0-fly.26.2-beta.5/CreateReiViewer-1.0.0-fly.26.2-beta.5%2Bfabric-mc26.2.jar
        run: |
          mkdir -p libs
          curl -fsSL -o "libs/$VIEWER_JAR_NAME" "$VIEWER_JAR_URL"

      - name: Build
        run: ./gradlew clean build validateAccessWidener --no-build-cache --no-daemon

      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: steam-rails-fabric-26.2
          path: |
            build/libs/Steam_Rails-*.jar
          if-no-files-found: error
